<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <p class="eyebrow">Admin</p>
        <h1>Security Center</h1>
      </div>
      <nav class="nav-tabs" aria-label="Dashboard sections">
        <button class="active" data-tab="overview" type="button">개요</button>
        <button data-tab="users" type="button">사용자</button>
        <button data-tab="logs" type="button">접근 로그</button>
        <button data-tab="ips" type="button">IP 차단</button>
      </nav>
      <button id="logoutButton" class="ghost-button" type="button">로그아웃</button>
    </aside>

    <main class="dashboard">
      <header class="topbar">
        <div>
          <p class="eyebrow">Session Active</p>
          <h2 id="welcomeTitle">관리자 대시보드</h2>
        </div>
        <span id="currentUser" class="badge">확인 중</span>
      </header>

      <section id="overview" class="tab-panel active">
        <div class="metric-grid">
          <article class="metric-card">
            <span>전체 사용자</span>
            <strong id="totalUsers">0</strong>
          </article>
          <article class="metric-card">
            <span>활성 사용자</span>
            <strong id="activeUsers">0</strong>
          </article>
          <article class="metric-card">
            <span>접근 로그</span>
            <strong id="totalLogs">0</strong>
          </article>
          <article class="metric-card">
            <span>차단 IP</span>
            <strong id="blockedIps">0</strong>
          </article>
        </div>
      </section>

      <section id="users" class="tab-panel">
        <div class="section-head">
          <h2>사용자 관리</h2>
          <input id="userSearch" class="search-input" placeholder="사용자 검색">
        </div>
        <form id="userForm" class="inline-form">
          <input id="newUsername" placeholder="아이디" required>
          <input id="newName" placeholder="이름" required>
          <input id="newPassword" type="password" placeholder="초기 비밀번호" required>
          <select id="newRole">
            <option value="admin">admin</option>
            <option value="manager">manager</option>
            <option value="viewer">viewer</option>
          </select>
          <button type="submit">추가</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>권한</th>
                <th>상태</th>
                <th>마지막 로그인</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </section>

      <section id="logs" class="tab-panel">
        <div class="section-head">
          <h2>접근 로그</h2>
          <button id="refreshLogs" class="secondary-button" type="button">새로고침</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>시간</th>
                <th>IP</th>
                <th>Method</th>
                <th>URL</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="logsTable"></tbody>
          </table>
        </div>
      </section>

      <section id="ips" class="tab-panel">
        <div class="section-head">
          <h2>IP 차단 관리</h2>
        </div>
        <form id="ipForm" class="inline-form">
          <input id="blockIp" placeholder="예: 203.0.113.10" required>
          <input id="blockReason" placeholder="차단 사유">
          <button type="submit">차단</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>IP</th>
                <th>사유</th>
                <th>등록일</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="ipsTable"></tbody>
          </table>
        </div>
      </section>
      <p id="toast" class="toast" role="status"></p>
    </main>
  </div>
  <script src="js/dashboard.js"></script>
</body>
</html>
